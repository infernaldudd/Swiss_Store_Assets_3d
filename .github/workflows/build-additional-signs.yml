name: Build three additional illuminated storefront signs

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/build_additional_signs.py"
      - ".github/workflows/build-additional-signs.yml"

permissions:
  contents: write

concurrency:
  group: swiss-additional-sign-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install Blender, fonts and glTF export dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender python3-numpy fonts-lato libegl1 libgl1-mesa-dri
      - name: Build and validate three new GLBs
        run: |
          blender -b -t 2 --python tools/build_additional_signs.py
          for name in AMIGOS_TripleA_Projected AMIGOS_SingleA_Projected EXIT_AUSGANG_Illuminated; do
            test -s "assets/$name.glb"
          done
          ls -lh assets/{AMIGOS_TripleA_Projected,AMIGOS_SingleA_Projected,EXIT_AUSGANG_Illuminated}.glb
      - name: Optional CPU-rendered inspection previews
        continue-on-error: true
        run: |
          RENDER_PREVIEWS=1 blender -b -t 2 --python tools/build_additional_signs.py
          find previews -maxdepth 1 -name '*.png' -ls
      - name: Commit only the three new assets and generated previews
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/AMIGOS_TripleA_Projected.glb assets/AMIGOS_SingleA_Projected.glb assets/EXIT_AUSGANG_Illuminated.glb
          if find previews/ -name '*.png' -print -quit | grep -q .; then git add -A previews/; fi
          if ! git diff --cached --quiet; then
            git commit -m "Add triple A, single A, and illuminated Swiss exit signage"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
