name: Build 100 separate dairy GLBs in five folders
on:
  workflow_dispatch:
  push:
    paths:
      - "catalog/dairy_100.json"
      - "tools/generate_dairy_artwork.py"
      - "tools/build_dairy_100.py"
      - ".github/workflows/build-dairy-100.yml"
permissions:
  contents: write
concurrency:
  group: dairy-100-5-batches
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender and original packaging design dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender python3-numpy python3-pil fonts-lato libegl1 libgl1-mesa-dri
      - name: Generate 100 unique dairy SKU label images
        run: |
          /usr/bin/python3 tools/generate_dairy_artwork.py
          test "$(find textures/dairy_100 -maxdepth 1 -name '*.jpg' | wc -l)" -eq 100
          test "$(find previews/dairy_100 -maxdepth 1 -name '*All_20.jpg' | wc -l)" -eq 5
      - name: Build and structurally validate 5 grouped GLB scenes with 20 distinct SKUs apiece
        run: |
          blender -b -t 2 --python tools/build_dairy_100.py
          test "$(find assets/dairy_100 -mindepth 2 -name '*.glb' | wc -l)" -eq 100
          ls -lh assets/dairy_100/
      - name: Validate exactly 100 unique products and non-repeating labels
        run: |
          /usr/bin/python3 - <<'PY'
          import json,glob,hashlib,os
          d=json.load(open("catalog/dairy_100.json"))
          a=[p for b in d["batches"] for p in b["products"]]
          assert len(a)==100 and len({x["id"] for x in a})==100
          assert len(glob.glob("assets/dairy_100/Batch_*/*.glb"))==100
          fingerprints=[hashlib.sha256(open("textures/dairy_100/"+p["id"]+".jpg","rb").read()).hexdigest() for p in a]
          assert len(set(fingerprints))==100,"Some labels are duplicates"
          for b in d["batches"]:
              assert len(b["products"])==20
          print("SUCCESS: 100 original products, 100 different artworks, five directories with 20 individual GLBs each")
          PY
      - name: Commit five 3D scene files, 100 textures and gallery sheets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets/dairy_100/ textures/dairy_100/ previews/dairy_100/
          if ! git diff --cached --quiet; then
            git commit -m "Add 100 unique dairy products as five separately organized GLB scenes"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
