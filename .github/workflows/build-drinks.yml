name: Build Swiss drink assets
on:
  workflow_dispatch:
  push:
    paths:
      - "tools/build_drinks.py"
      - "tools/generate_drink_labels.py"
      - "tools/generate_surface_finish_maps.py"
      - ".github/workflows/build-drinks.yml"
permissions:
  contents: write
concurrency:
  group: build-drinks
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender python3-numpy python3-pil fonts-lato
      - name: Generate 12 original 2K curved-print texture maps
        run: |
          /usr/bin/python3 tools/generate_surface_finish_maps.py
          /usr/bin/python3 tools/generate_drink_labels.py
          test "$(find textures/drinks -name '*_wrap_2K.png' | wc -l)" -eq 12
      - name: Rebuild and validate all twelve properly labelled drinks
        run: |
          blender -b -t 2 --python tools/build_drinks.py
          test "$(find assets/drinks -maxdepth 1 -name '*.glb' | wc -l)" -eq 12
          ls -lh assets/drinks/
      - name: Render VOLTIX and representative cans and PET for label curvature QA
        run: |
          RENDER_PREVIEWS=1 blender -b -t 2 --python tools/build_drinks.py
          test "$(find previews/drinks -name '*Curved_Labels.png' | wc -l)" -eq 4
      - name: Commit drink assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets/drinks/ textures/drinks/ previews/drinks/ textures/surface_finishes/
          if ! git diff --cached --quiet; then
            git commit -m "Fix all 12 beverage label meshes with original curved 2K UV print artwork"
            for attempt in 1 2 3 4 5; do
              git pull --rebase -X theirs origin main
              if git push origin HEAD:main; then
                echo "Uploaded drink assets after attempt $attempt"
                exit 0
              fi
              echo "Concurrent repository push; retrying..."
              sleep 3
            done
            echo "Could not safely push drink models" >&2
            exit 1
          fi
