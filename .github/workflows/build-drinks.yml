name: Build Swiss drink assets
on:
  workflow_dispatch:
  push:
    paths:
      - "tools/build_drinks.py"
      - ".github/workflows/build-drinks.yml"
permissions:
  contents: write
concurrency:
  group: build-drinks
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender python3-numpy
      - name: Generate and validate all twelve drink models
        run: |
          blender -b -t 2 --python tools/build_drinks.py
          test "$(find assets/drinks -maxdepth 1 -name '*.glb' | wc -l)" -eq 12
          ls -lh assets/drinks/
      - name: Commit drink assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets/drinks/
          if ! git diff --cached --quiet; then
            git commit -m "Add twelve original Swiss grocery drink GLBs"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
